<div id="list">
    @for (item of blogs().data; track $index) {
    <div class="item">
        <div>
            <h2>
                <a routerLink="/blogs/{{item.name}}">{{item.attributes.title}}</a>
            </h2>
            <span>
                @for (key of item.attributes.tags; track $index) {
                <code>{{key}}</code>
                }
            </span>
            <p>{{item.attributes.summary}}</p>
        </div>
        <span class="spacer"></span>
        <div>
            <img src="blog/img/{{item.attributes.image}}" />
        </div>

    </div>
    }
</div>
<mat-paginator (page)="handlePageEvent($event)" [length]="blogs().length" [pageSize]="blogs().size"
    [pageIndex]="blogs().index" aria-label="Select page">
</mat-paginator>
