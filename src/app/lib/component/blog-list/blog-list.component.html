<div id="list">
    @for (item of blogs(); track $index) {
    <div class="item">
        <div>
            <img src="blog/img/{{item.attributes.image}}" />
        </div>
        <div>
            <h2>
                <a routerLink="/blog/angular/highlightjs">{{item.attributes.title}}</a>
            </h2>
            <span>
                @for (key of item.attributes.tags; track $index) {
                    <code>{{key}}</code>
                }
            </span>
            <p>{{item.attributes.summary}}</p>
        </div>

    </div>
    }

</div>
